<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Personal Information Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 24px;
      background: #f7f7f7;
    }
    form {
      background: white;
      padding: 28px;
      border-radius: 10px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }
    h1 { margin-top: 0; }
    .field { margin: 16px 0; }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }
    input, textarea, select {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      border: 1px solid #bbb;
      border-radius: 5px;
      font-size: 15px;
    }
    textarea { min-height: 80px; resize: vertical; }
    button {
      margin-top: 18px;
      padding: 11px 20px;
      border: 0;
      border-radius: 5px;
      background: #333;
      color: white;
      cursor: pointer;
    }
    .test-note {
      background: #fff8dc;
      border-left: 4px solid #d6a400;
      padding: 10px 14px;
      margin-bottom: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h1>Personal Information Form</h1>

  <div class="test-note">
    Demo form for testing the AI form filler. One field,
    "Passport Number", is intentionally not present in the source document.
    The expected model output for that field is "Not Available".
  </div>

  <form id="personal-info-form">

    <div class="field">
      <label for="full_legal_name">Full Legal Name</label>
      <input type="text" id="full_legal_name" name="full_legal_name">
    </div>

    <div class="field">
      <label for="date_of_birth">Date of Birth</label>
      <input type="text" id="date_of_birth" name="date_of_birth"
             placeholder="e.g. 22 August 1991">
    </div>

    <div class="field">
      <label for="residential_address">Residential Address</label>
      <textarea id="residential_address" name="residential_address"></textarea>
    </div>

    <div class="field">
      <label for="city">City</label>
      <input type="text" id="city" name="city">
    </div>

    <div class="field">
      <label for="state">State</label>
      <input type="text" id="state" name="state">
    </div>

    <div class="field">
      <label for="postal_code">ZIP / Postal Code</label>
      <input type="text" id="postal_code" name="postal_code">
    </div>

    <div class="field">
      <label for="phone_number">Phone Number</label>
      <input type="tel" id="phone_number" name="phone_number">
    </div>

    <div class="field">
      <label for="email_address">Email Address</label>
      <input type="email" id="email_address" name="email_address">
    </div>

    <div class="field">
      <label for="employer">Employer</label>
      <input type="text" id="employer" name="employer">
    </div>

    <div class="field">
      <label for="occupation">Occupation</label>
      <input type="text" id="occupation" name="occupation">
    </div>

    <!-- Intentionally absent from demo_private_profile.pdf -->
    <div class="field">
      <label for="passport_number">Passport Number</label>
      <input type="text" id="passport_number" name="passport_number">
    </div>

    <div class="field">
      <label for="additional_notes">Additional Notes</label>
      <textarea id="additional_notes" name="additional_notes"></textarea>
    </div>

    <button type="submit">Submit</button>
  </form>

</body>
</html>
